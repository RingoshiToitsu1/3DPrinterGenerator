<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo to 3D</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo to 3D">
<meta name="theme-color" content="#f97316">
<style>
  :root {
    --bg: #f6f5f3; --card: #ffffff; --text: #1c1917; --muted: #78716c;
    --accent: #f97316; --accent-text: #ffffff; --ok: #16a34a; --off: #a8a29e; --border: #e7e5e4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121110; --card: #1c1a18; --text: #f5f5f4; --muted: #a8a29e; --border: #2e2b28; --off: #57534e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  main {
    width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 32px 24px; text-align: center;
  }
  .logo { width: 64px; height: 64px; margin: 0 auto 12px; display: block; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); margin: 8px 0 20px; min-height: 24px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }
  .dot.wait { animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .3 } to { opacity: 1 } }
  .btn {
    display: block; width: 100%; padding: 14px; border: 0; border-radius: 12px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-text); text-decoration: none; cursor: pointer;
  }
  .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn[hidden] { display: none; }
  p.hint { color: var(--muted); font-size: 14px; margin: 16px 0 0; }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#f97316"/>
    <path d="M32 13 49 22.5v19L32 51 15 41.5v-19Z" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M15 22.5 32 32l17-9.5M32 32v19" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/>
  </svg>
  <h1>Photo to 3D</h1>
  <div class="status"><span class="dot wait" id="dot"></span><span id="msg">Looking for your laptop…</span></div>
  <a class="btn" id="open" hidden>Open</a>
  <button class="btn secondary" id="retry" hidden>Check again</button>
  <p class="hint" id="hint"></p>
</main>
<script>
  // Which GitHub account to read the link from: the "<user>.github.io" this page is
  // served on, or ?user=<name> for testing elsewhere.
  const params = new URLSearchParams(location.search);
  const host = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "";
  const USER = params.get("user") || host;
  const API = params.get("api") || "https://api.github.com";
  const FILE = "photo-to-3d-link.json";
  const FRESH_MINUTES = 12; // the laptop re-saves its link every 5 minutes

  const $ = (id) => document.getElementById(id);
  function show(state, text, hint = "") {
    $("dot").className = "dot" + (state === "ok" ? " ok" : state === "wait" ? " wait" : "");
    $("msg").textContent = text;
    $("hint").textContent = hint;
    $("retry").hidden = state !== "off";
  }
  function ago(sec) {
    const m = Math.round(sec / 60);
    if (m < 60) return m + " min ago";
    const h = Math.round(m / 60);
    if (h < 48) return h + " h ago";
    return Math.round(h / 24) + " days ago";
  }

  async function check() {
    show("wait", "Looking for your laptop…");
    $("open").hidden = true;
    try {
      if (!USER) throw new Error("no-user");
      const list = await fetch(`${API}/users/${USER}/gists?per_page=100`, { cache: "no-store" });
      if (!list.ok) throw new Error("api-" + list.status);
      const gist = (await list.json()).find((g) => g.files && g.files[FILE]);
      if (!gist) {
        show("off", "Not set up yet", "Start start-public.bat on the laptop with your GitHub token.");
        return;
      }
      const res = await fetch(`${API}/gists/${gist.id}`, { cache: "no-store" });
      if (!res.ok) throw new Error("api-" + res.status);
      const data = JSON.parse((await res.json()).files[FILE].content || "{}");
      const age = Date.now() / 1000 - (data.updated || 0);
      if (!data.url || age > FRESH_MINUTES * 60) {
        show("off", "Laptop is offline",
          (data.updated ? "Last seen " + ago(age) + ". " : "") + "Start start-public.bat on the laptop, then check again.");
        return;
      }
      show("ok", "Laptop is online");
      $("open").href = data.url;
      $("open").hidden = false;
      if (!params.has("stay")) setTimeout(() => location.replace(data.url), 600);
    } catch (e) {
      const limited = String(e.message).startsWith("api-403") || String(e.message).startsWith("api-429");
      show("off", "Couldn't check right now",
        limited ? "GitHub is limiting checks from this network. Wait a few minutes." :
        e.message === "no-user" ? "Open this page from its github.io address." : "Check your internet connection.");
    }
  }

  $("retry").addEventListener("click", check);
  check();
</script>
</body>
</html>
